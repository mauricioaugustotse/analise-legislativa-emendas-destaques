name: Testes
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - name: Exemplo de ponta a ponta (coleta local e parser)
        run: |
          python examples/build_synthetic_inputs.py work/demo_input
          analise-legislativa collect --input-dir work/demo_input --workspace work/demo
          analise-legislativa prepare --workspace work/demo
